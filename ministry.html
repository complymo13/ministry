<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 봉사 기록</title><style>*{box-sizing:border-box} :root{--green:#28664b;--soft:#e8f2eb;--ink:#20352b;--border:#dce6df}body{margin:0;background:#f5f8f5;color:var(--ink);font:16px system-ui,-apple-system,sans-serif}main{max-width:600px;margin:auto;padding:22px 16px 105px}header{display:flex;align-items:center;gap:12px;margin:4px 0 22px}.brand{width:40px;height:40px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font-size:22px}header h1{margin:0;font-size:23px;letter-spacing:-1px}header small,.eyebrow{display:none}section,.card{background:white;border:1px solid var(--border);border-radius:16px;padding:18px;margin:12px 0}h2{font-size:17px;margin:0 0 14px;letter-spacing:-.4px}p{font-size:14px;line-height:1.6}button,input,select,textarea{font:inherit;border:1px solid var(--border);border-radius:9px;padding:11px;max-width:100%}input,textarea,select{width:100%;margin:5px 0 12px;background:white;color:var(--ink)}input:focus,textarea:focus{outline:2px solid #8db49b;outline-offset:1px}button{background:var(--soft);color:var(--green);cursor:pointer;min-height:44px;font-weight:600}button.primary{background:var(--green);color:white;border:0;width:100%;min-height:48px}nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);display:flex;justify-content:center;padding:7px 6px calc(7px + env(safe-area-inset-bottom));gap:3px}nav button{flex:1;max-width:120px;border:0;background:white;color:#64756b;font-size:12px;padding:8px 2px}nav button.active{background:var(--soft);color:var(--green)}nav svg{display:block;margin:0 auto;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav br{display:none}small,.muted{color:#66776c;font-size:12px}progress{width:100%;accent-color:var(--green);height:9px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.grid b{font-size:12px;padding:8px 0;color:#64756b}.grid b:first-child{color:#b65d5d}.day{padding:5px 1px;min-height:58px;background:#f4f8f4;border:0;font-size:13px;color:var(--ink)}.day small{display:block;font-size:9px;color:var(--green);overflow-wrap:anywhere}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.big{font-size:30px;font-weight:750;color:var(--green);letter-spacing:-1px}.line{padding:12px 0;border-bottom:1px solid var(--border)}.line:last-child{border:0}label{font-size:14px;font-weight:600}.danger{color:#a33}.hero{background:var(--green);color:white;border:0}.hero small,.hero .big{color:white}.hero h2{margin-top:12px;font-weight:500}.hero progress{appearance:none;border:0;border-radius:8px;overflow:hidden;background:#ffffff40;margin-top:14px}.hero progress::-webkit-progress-bar{background:#ffffff40}.hero progress::-webkit-progress-value{background:white;border-radius:8px}.hero progress::-moz-progress-bar{background:white}.hero p{margin-bottom:0}.monthbar{padding:3px 0}.monthbar h2{margin:0}.monthbar button{flex:0 0 44px;border:0;font-size:22px}.metric{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:11px 0;font-size:13px}.metric strong{color:var(--green);text-align:right}.yearline{display:grid;grid-template-columns:65px 1fr 90px;align-items:center;gap:8px;font-size:12px}.yearline strong{text-align:right;font-size:11px}@media(max-width:370px){main{padding-left:12px;padding-right:12px}section{padding:14px}.big{font-size:27px}}.verse-header{background:var(--soft);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:18px;display:block}.verse-header h1{font-size:15px;line-height:1.8;letter-spacing:-.25px;font-weight:600;word-break:keep-all;overflow-wrap:break-word}.verse-header p{margin:9px 0 0;text-align:right;color:var(--green);font-size:12px;font-weight:600}</style><main><header class="verse-header"><div><h1>그러나 그대​는 모든 일​에 정신​을 차리고, 고난​을 인내​하고, 복음 전파자​의 일​을 하고, 봉사​의 직무​를 완수​하십시오.</h1><p>-디모데 후서 4:5-</p></div></header><div id="app"></div></main><nav id="nav"></nav><script>
const $=id=>document.getElementById(id), today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, fmt=n=>`${Math.floor(n/60)}시간 ${n%60}분`, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db;try{db=JSON.parse(localStorage.getItem('service-v1'))||{records:[],visits:[]}}catch{db={records:[],visits:[]}}let month=today().slice(0,7),date=today(),page='홈',kind='야외 봉사',edit=null,ve=null,visitSelected=null,visitAdding=false;function save(){try{localStorage.setItem('service-v1',JSON.stringify(db))}catch{alert('저장할 수 없습니다. 백업을 내려받으세요.')}}function shift(m,n){let [y,k]=m.split('-').map(Number),d=new Date(y,k-1+n,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}function start(m){let [y,k]=m.split('-').map(Number);return `${k>=9?y:y-1}-09`}function sums(m){let r=db.records.filter(x=>x.date.startsWith(m)&&!x.plan),f=r.filter(x=>x.kind==='야외 봉사').reduce((a,x)=>a+x.min,0),v=r.filter(x=>x.kind==='자원봉사').reduce((a,x)=>a+x.min,0),a=Math.min(v,Math.max(0,3300-f));return {f,v,a,total:f+a}}function report(m){let c=0;for(let k=start(m);k<m;k=shift(k,1)){let left=(c+sums(k).f)%60;c=db.carryChoices?.[k]===true?left:0}let n=c+sums(m).f;return {c,h:Math.floor(n/60),left:n%60}}
function pendingCarry(){let now=today().slice(0,7);for(let k=start(now);k<now;k=shift(k,1)){if(report(k).left&&db.carryChoices?.[k]===undefined)return k}return null}
function chooseCarry(m,yes){if(m>=today().slice(0,7)||m.endsWith('-08'))return;db.carryChoices??={};db.carryChoices[m]=yes;save();render()}
function carryPanel(){let k=pendingCarry();if(!k)return '';return `<section><h2>이월 확인</h2><p>${k} 야외 봉사 잔여 ${report(k).left}분을 ${shift(k,1)}로 이월할까요?</p><div class=row><button class=primary onclick="chooseCarry('${k}',true)">확인</button><button onclick="chooseCarry('${k}',false)">아니요</button></div></section>`}
function carryStatus(m,r){if(m.endsWith('-08'))return '봉사 연도 종료 · 이월 없음';if(!r.left)return '다음 달 이월 0분';let v=db.carryChoices?.[m];return v===true?'다음 달 이월 확정 '+r.left+'분':v===false?'이월하지 않음':'잔여 '+r.left+'분 · '+(m<today().slice(0,7)?'이월 확인 대기':'월 종료 후 이월 확인')}
function go(p){page=p;edit=null;ve=null;visitSelected=null;visitAdding=false;render()}function monthbar(){return `<div class="row monthbar"><button onclick="month=shift(month,-1);render()">‹</button><h2 style="text-align:center;flex:3">${month}</h2><button onclick="month=shift(month,1);render()">›</button></div>`}const icons=['<svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10H3zM9 20v-7h6v7"/></svg>','<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h2m4 0h2"/></svg>','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8m-4-4h8"/></svg>','<svg viewBox="0 0 24 24"><path d="M12 21S4 14 4 9a8 8 0 0 1 16 0c0 5-8 12-8 12z"/><circle cx="12" cy="9" r="2.5"/></svg>','<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="white"/><circle cx="16" cy="12" r="2" fill="white"/><circle cx="10" cy="18" r="2" fill="white"/></svg>'];function render(){ $('nav').innerHTML=['홈','달력','기록','재방문','설정'].map((p,i)=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${icons[i]}<br>${p}</button>`).join('');let s=sums(month),r=report(month),st=start(month),annual=0;for(let i=0;i<12;i++)annual+=sums(shift(st,i)).total;let h='';if(page==='홈'){h=monthbar()+carryPanel()+`<section class="hero"><small>${st} ~ ${shift(st,11)} 봉사 연도</small><h2>연간 목표 600시간</h2><div class=big>${fmt(annual)}</div><progress max=36000 value=${annual}></progress><p>달성률 ${(annual/360).toFixed(1)}% · 남은 ${fmt(Math.max(0,36000-annual))}</p></section><section><h2>이번 달 봉사 시간</h2><div class=big>${fmt(s.total)}</div><div class="metric">야외 봉사<strong>${fmt(s.f)}</strong></div><div class="metric">연구 건수<strong>${studyCount(month)}건 <button onclick="setStudyCount()" style="width:auto;padding:5px 9px;margin-left:6px">수정</button></strong></div><div class="metric">자원봉사<strong>${fmt(s.a)}</strong></div></section><section><button class=primary onclick="openShare()">봉사 시간 공유</button></section><section><h2>연간 월별 기록</h2>${Array.from({length:12},(_,i)=>{let m=shift(st,i);return `<div class="line yearline"><span>${m}</span><progress max="3000" value="${sums(m).total}"></progress><strong>${fmt(sums(m).total)}</strong></div>`}).join('')}</section>`}if(page==='달력'){let [y,m]=month.split('-').map(Number),offset=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();h=monthbar()+`<section><div class=grid>${'일 월 화 수 목 금 토'.split(' ').map(x=>`<b>${x}</b>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{let d=month+'-'+String(i+1).padStart(2,'0'),rs=db.records.filter(x=>x.date===d),v=db.visits.filter(x=>x.next===d);return `<button class=day onclick="date='${d}';go('달력')" style="${date===d?'outline:2px solid #28664b':''}">${i+1}${rs.map(x=>`<small>${x.plan?'예정':x.kind==='자원봉사'?'자원':'야외'} ${fmt(x.min)}</small>`).join('')}${v.length?'<small>재방문 '+v.length+'</small>':''}</button>`}).join('')}</div></section><section><h2>${date}</h2>${records(date)}${db.visits.filter(x=>x.next===date).map(x=>`<p>재방문: ${esc(x.name)}</p>`).join('')}<button class=primary onclick="go('기록')">이 날짜 기록 추가</button></section>`}if(page==='기록'){let x=db.records.find(x=>x.id===edit)||{};h=`<div class=row>${['야외 봉사','자원봉사'].map(k=>`<button style="${kind===k?'background:#28664b;color:white':''}" onclick="kind='${k}';edit=null;render()">${k}</button>`).join('')}</div><section><form onsubmit="addRecord(event)"><label>날짜<input id=d type=date required value="${x.date||date}"></label>${kind==='자원봉사'?`<label>자원봉사 이름<input id=rn required value="${esc(x.name)}" placeholder="예: 건축 봉사" list=names></label><datalist id=names>${[...new Set(db.records.filter(x=>x.kind===kind).map(x=>x.name))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`:''}<div class=row><label>시간<input id=hh type=number min=0 max=744 value=${Math.floor((x.min||0)/60)} required></label><label>분<input id=mm type=number min=0 max=59 value=${(x.min||0)%60} required></label></div><label>메모<textarea id=memo>${esc(x.memo)}</textarea></label><label><input id=plan type=checkbox style="width:auto" ${x.plan?'checked':''}> 예정 기록 (합계 제외)</label><button class=primary>저장</button></form></section><section><h2>최근 ${kind} 기록</h2>${records(null,kind)}</section>`}if(page==='재방문'){let x=db.visits.find(x=>x.id===ve)||{};h=`<section><h2>재방문 기록지</h2><form onsubmit="addVisit(event)"><label>이름 또는 별칭 (선택)<input id=vn value="${esc(x.name)}"></label><label>주소<input id=addr value="${esc(x.addr)}"></label><button type=button onclick="addressSearch()">주소 검색</button><button type=button onclick="copyAddress()">주소 복사</button><p id=addressStatus class=muted role=status></p><div id=postcode></div><label>상세 주소<input id=detail value="${esc(x.detail)}"></label><label>방문 날짜<input id=vd type=date value="${x.date||today()}"></label><label>다음 방문 날짜<input id=next type=date value="${x.next||''}"></label><label>대화 내용 및 다음 주제<textarea id=vm>${esc(x.memo)}</textarea></label><label><input id=study type=checkbox style="width:auto" ${x.study?'checked':''}> 성서 연구</label><button class=primary>저장</button></form></section><section><h2>재방문 목록</h2>${db.visits.map(x=>`<div class=line><button type=button style="text-align:left" onclick="selectVisit('${x.id}')"><b>${esc(x.name)}</b> · 방문 기록 보기</button> ${x.study?'· 성서 연구':''}<p>${esc(x.addr)} ${esc(x.detail)}</p><small>다음 방문 ${esc(x.next||'미정')}</small>${visitSelected===x.id?visitHistory(x):''}<button onclick="ve='${x.id}';render();scrollTo(0,0)">수정</button> <button onclick="del('visits','${x.id}')">삭제</button></div>`).join('')||'기록 없음'}</section>`}if(page==='설정'){h=`<section><h2>기록 백업</h2><p>기록은 이 브라우저에만 저장됩니다. 브라우저 데이터를 삭제하면 사라질 수 있습니다.</p><button onclick="backup()">백업 파일 저장</button><p>백업 복원</p><input type=file accept=".json" onchange="restore(this)"><p class=muted>재방문 정보는 개인정보입니다. 필요한 정보만 기록하고 백업 파일을 안전하게 보관하세요. 이 웹앱에는 별도 암호화나 잠금 기능이 없습니다.</p></section>`}$('app').innerHTML=h}function records(d,k){return db.records.filter(x=>(!d||x.date===d)&&(!k||x.kind===k)).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class=line><b>${esc(x.date)} · ${esc(x.kind)} ${x.plan?'(예정)':''}</b><p>${esc(x.name||'')} ${fmt(x.min)} ${esc(x.memo)}</p><button onclick="page='기록';kind='${x.kind}';edit='${x.id}';render();scrollTo(0,0)">수정</button> <button onclick="del('records','${x.id}')">삭제</button></div>`).join('')||'<p class=muted>기록 없음</p>'}function put(key,x){let i=db[key].findIndex(y=>y.id===x.id);if(i<0)db[key].push(x);else db[key][i]=x;save()}function addRecord(e){e.preventDefault();let min=+$('hh').value*60+ +$('mm').value;if(!min)return alert('시간을 입력하세요');date=$('d').value;month=date.slice(0,7);put('records',{id:edit||String(Date.now()),date,kind,min,name:$('rn')?.value||'',memo:$('memo').value,plan:$('plan').checked});edit=null;render()}function selectVisit(id){visitSelected=visitSelected===id?null:id;visitAdding=false;render()}
function visitEntries(x){return Array.isArray(x.history)?x.history:[{date:x.date,memo:x.memo,study:x.study,next:x.next}]}
function visitHistory(x){return `<div style="margin:12px 0"><button class=primary onclick="visitAdding=true;render()">＋ 오늘 기록 추가</button>${visitAdding?`<form onsubmit="appendVisit(event)"><label>방문 날짜<input id=hd type=date required value="${today()}"></label><label>대화 내용 및 다음 주제<textarea id=hm required></textarea></label><label>다음 방문 날짜<input id=hn type=date value="${esc(x.next||'')}"></label><label><input id=hs type=checkbox style="width:auto" ${x.study?'checked':''}> 성서 연구</label><button class=primary>오늘 기록 저장</button><button type=button onclick="visitAdding=false;render()">취소</button></form>`:''}<h2>방문 기록 내역</h2><p class=muted>기록을 길게 누르거나 오른쪽 삭제 버튼을 누르세요.</p>${visitEntries(x).map((h,i)=>({h,i})).reverse().sort((a,b)=>String(b.h.date).localeCompare(String(a.h.date))).map(({h,i})=>`<div class="line visit-entry" data-entry="${i}" tabindex="0" role="button" aria-label="방문 기록 길게 눌러 삭제" style="touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><b>${esc(h.date)}</b><button type="button" class="entry-delete" style="font-size:12px;min-height:34px;padding:5px 10px;color:#a33;background:white" onclick="event.stopPropagation();deleteVisitEntry(${i})">삭제</button></div>${h.study?' · 성서 연구':''}<p style="white-space:pre-wrap">${esc(h.memo)}</p><small>다음 방문: ${esc(h.next||'미정')}</small></div>`).join('')}</div>`}

let holdTimer=null, holdPoint=null;
function cancelHold(){clearTimeout(holdTimer);holdTimer=null;holdPoint=null;}
function deleteVisitEntry(i){cancelHold();let x=db.visits.find(v=>v.id===visitSelected);if(!x)return;let entries=visitEntries(x).slice();if(!entries[i])return;let old=document.getElementById('entryDeleteDialog');if(old)return;let overlay=document.createElement('div');overlay.id='entryDeleteDialog';overlay.style.cssText='position:fixed;inset:0;z-index:1000;background:#0006;display:grid;place-items:center;padding:24px';overlay.innerHTML=`<div class="card" role="dialog" aria-modal="true" style="width:100%;max-width:340px"><h2>방문 기록 삭제</h2><p>${esc(entries[i].date)} 방문 기록만 삭제할까요?</p><div class="row"><button type="button" id="entryCancel">취소</button><button type="button" class="primary" id="entryConfirm">삭제</button></div></div>`;document.body.appendChild(overlay);overlay.querySelector('#entryCancel').onclick=()=>overlay.remove();overlay.querySelector('#entryConfirm').onclick=()=>{entries.splice(i,1);x.history=entries;Object.assign(x,entries[entries.length-1]||{date:'',memo:'',next:'',study:false});save();overlay.remove();render();};}
function beginHold(e,p){let el=e.target.closest('.visit-entry');if(!el||e.target.closest('button'))return;cancelHold();holdPoint=[p.clientX,p.clientY];let i=Number(el.dataset.entry);holdTimer=setTimeout(()=>{cancelHold();deleteVisitEntry(i)},550);}
function moveHold(p){if(holdPoint&&Math.hypot(p.clientX-holdPoint[0],p.clientY-holdPoint[1])>12)cancelHold();}
document.addEventListener('touchstart',e=>{if(e.touches.length===1)beginHold(e,e.touches[0]);else cancelHold();},{passive:true});
document.addEventListener('touchmove',e=>{if(e.touches.length)moveHold(e.touches[0]);},{passive:true});
for(let ev of ['touchend','touchcancel','scroll'])document.addEventListener(ev,cancelHold,true);
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'&&e.button===0)beginHold(e,e);});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='touch')moveHold(e);});
for(let ev of ['pointerup','pointercancel'])document.addEventListener(ev,e=>{if(e.pointerType!=='touch')cancelHold();},true);
document.addEventListener('contextmenu',e=>{let el=e.target.closest('.visit-entry');if(el&&!e.target.closest('button')){e.preventDefault();deleteVisitEntry(Number(el.dataset.entry));}});
document.addEventListener('keydown',e=>{let el=e.target.closest('.visit-entry');if(el&&!e.target.closest('button')&&(e.key==='Delete'||e.key==='Enter')){e.preventDefault();deleteVisitEntry(Number(el.dataset.entry));}});
function appendVisit(e){e.preventDefault();let x=db.visits.find(x=>x.id===visitSelected);if(!x)return;let h={date:$('hd').value,memo:$('hm').value,next:$('hn').value,study:$('hs').checked};x.history=[...visitEntries(x),h];Object.assign(x,h);save();visitAdding=false;render()}
function addVisit(e){e.preventDefault();if(!$('vn').value.trim()&&!$('addr').value.trim()&&!$('vm').value.trim())return alert('주소, 이름 또는 대화 내용을 입력해 주세요.');let old=db.visits.find(x=>x.id===ve);put('visits',{...(old||{}),id:ve||String(Date.now()),name:$('vn').value.trim()||'이름 미상',addr:$('addr').value,detail:$('detail').value,date:$('vd').value,next:$('next').value,memo:$('vm').value,study:$('study').checked});if(old?.history?.length){let updated=db.visits.find(x=>x.id===ve);updated.history=old.history.slice();updated.history[updated.history.length-1]={date:updated.date,memo:updated.memo,next:updated.next,study:updated.study};save()}ve=null;render()}function del(k,id){if(confirm('삭제할까요?')){db[k]=db[k].filter(x=>x.id!==id);save();render()}}async function copyAddress(){const a=$('addr');if(!a||!a.value.trim())return alert('복사할 주소를 먼저 입력해 주세요.');let ok=false;try{a.focus();a.select();a.setSelectionRange(0,a.value.length);ok=document.execCommand('copy');}catch(e){}if(!ok){try{await navigator.clipboard.writeText(a.value);ok=true;}catch(e){}}$('addressStatus').textContent=ok?'✓ 주소 복사 완료':'자동 복사가 차단되었습니다. 선택된 주소를 길게 눌러 복사해 주세요.';return ok;}
function addressSearch(){
const el=$('postcode');el.style.display='block';el.innerHTML=`<div class="line"><label>도로명 또는 건물 이름<input id="jusoQuery" placeholder="예: 포천시 중앙로 100"></label><div class="row"><button type="button" id="jusoSearch">검색</button><button type="button" id="jusoClose">닫기</button></div><p id="jusoMessage" role="status" class="muted"></p><div id="jusoResults"></div><details><summary>주소 검색 승인키 설정</summary><label>검색 API 승인키<input id="jusoKey" type="password" autocomplete="off"></label><button type="button" id="jusoSave">승인키 저장</button><p>도로명주소 개발자센터에서 검색 API 승인키를 발급받아 입력하세요. <a href="https://business.juso.go.kr/" target="_blank" rel="noopener noreferrer">발급 사이트</a></p></details></div>`;
const q=$('jusoQuery'), key=$('jusoKey'), msg=$('jusoMessage'), results=$('jusoResults');try{key.value=localStorage.getItem('service-juso-key')||''}catch(e){};$('jusoSave').onclick=()=>{try{localStorage.setItem('service-juso-key',key.value.trim());msg.textContent='승인키 저장 완료'}catch(e){msg.textContent='승인키를 저장하지 못했습니다. 이번 검색에서는 입력한 키를 사용합니다.'}};$('jusoClose').onclick=()=>{el.style.display='none'};
let request=0;async function search(){const keyword=q.value.trim(),token=key.value.trim();if(!token){el.querySelector('details').open=true;msg.textContent='먼저 검색 API 승인키를 입력해 주세요.';return}if(keyword.length<2){msg.textContent='검색어를 두 글자 이상 입력하세요.';return}const id=++request;results.replaceChildren();msg.textContent='검색 중…';const params=new URLSearchParams({confmKey:token,currentPage:'1',countPerPage:'30',keyword,resultType:'json'});function jsonp(host){return new Promise((resolve,reject)=>{const cb='jusoCallback_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');let timer;function cleanup(){clearTimeout(timer);script.remove();delete window[cb]}function fail(reason){cleanup();reject(new Error(reason))}window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>fail('스크립트 연결 차단');script.onload=()=>{if(window[cb])fail('콜백 응답 없음')};timer=setTimeout(()=>fail('응답 시간 초과'),8000);script.src=host+'/addrlink/addrLinkApiJsonp.do?'+params+'&callback='+cb;document.head.append(script)})}let data,errors=[];for(const host of ['https://www.juso.go.kr','https://business.juso.go.kr']){try{data=await jsonp(host);break}catch(e){errors.push(e.message)}}if(!data){for(const host of ['https://business.juso.go.kr','https://www.juso.go.kr']){try{const response=await fetch(host+'/addrlink/addrLinkApi.do?'+params,{signal:AbortSignal.timeout(8000)});if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();break}catch(e){errors.push(e.message)}}}if(id!==request||!el.isConnected)return;if(!data){msg.textContent='연결 실패: '+errors.join(' / ')+' ('+location.protocol+'). 아래 공식 검색 사이트에서 주소를 복사하거나 직접 입력하세요.';const link=document.createElement('a');link.href='https://www.juso.go.kr/';link.target='_blank';link.rel='noopener noreferrer';link.textContent='공식 도로명주소 검색 열기';results.append(link);return}if(typeof data==='string'){try{data=JSON.parse(data)}catch(e){}}const r=data?.results;if(!r||String(r.common?.errorCode)!=='0'){msg.textContent='API 오류 '+(r?.common?.errorCode||'')+': '+(r?.common?.errorMessage||'응답 형식 오류');return}const rows=r.juso||[];msg.textContent=rows.length?'도로명 주소를 누르면 바로 입력됩니다.':'검색 결과가 없습니다.';for(const item of rows){if(!item.roadAddr)continue;const btn=document.createElement('button');btn.type='button';btn.style.cssText='width:100%;text-align:left;margin:4px 0;white-space:normal';btn.textContent=item.roadAddr;btn.onclick=()=>{$('addr').value=item.roadAddr;el.style.display='none';$('addressStatus').textContent='✓ 주소 입력 완료';$('detail').focus()};results.append(btn)}}$('jusoSearch').onclick=search;q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};q.focus();}
function studyCount(m){return db.studyCounts?.[m] ?? db.visits.filter(x=>visitEntries(x).some(h=>h.study&&h.date?.startsWith(m))).length}
function setStudyCount(){let n=prompt(month+' 성서 연구 건수 (같은 연구는 한 번만 계산)',studyCount(month));if(n===null)return;if(!/^\d+$/.test(n.trim())||!Number.isSafeInteger(Number(n)))return alert('0 이상의 정수를 입력하세요.');db.studyCounts??={};db.studyCounts[month]=Number(n);save();render()}
function shareText(m){let s=sums(m),r=report(m),[y,k]=m.split('-'),lines=[`${y}년 ${Number(k)}월 봉사 보고`,'',`야외 봉사 보고: ${r.h}시간`,`성서 연구: ${studyCount(m)}건`];if(s.v){let groups=new Map();for(let x of db.records.filter(x=>!x.plan&&x.kind==='자원봉사'&&x.date.startsWith(m))){let name=x.name?.trim()||'자원봉사';groups.set(name,(groups.get(name)||0)+x.min)}lines.push('','자원봉사');for(let [name,min] of groups)lines.push(`- ${name}: ${fmt(min)}`);lines.push(`합계: ${fmt(r.h*60+s.v)}`)}return lines.join('\n')}
function openShare(){let k=pendingCarry();if(k&&k<month&&start(k)===start(month)){alert('먼저 홈 화면의 이월 확인을 완료해 주세요.');return}let old=$('sharePanel');if(old)old.remove();let el=document.createElement('section');el.id='sharePanel';el.innerHTML=`<h2>봉사 시간 공유</h2><p class=muted>선택한 달의 보고 내용입니다. 연구 건수를 확인하세요.</p><textarea id=shareContent readonly rows=12 style="width:100%;box-sizing:border-box"></textarea><button class=primary onclick="sendShare()">카카오톡 등으로 공유</button><button onclick="copyReport()" style="margin-top:8px">보고 내용 복사</button> <button onclick="$('sharePanel').remove()">닫기</button><p id=shareStatus role=status></p>`;$('app').prepend(el);$('shareContent').value=shareText(month);el.scrollIntoView({block:'start'})}
async function copyReport(){let a=$('shareContent'),ok=false;try{a.focus();a.select();a.setSelectionRange(0,a.value.length);ok=document.execCommand('copy')}catch(e){}if(!ok)try{await navigator.clipboard.writeText(a.value);ok=true}catch(e){}$('shareStatus').textContent=ok?'복사 완료! 카카오톡에 붙여넣으세요.':'자동 복사가 차단되었습니다. 선택된 내용을 직접 복사하세요.'}
async function sendShare(){if(navigator.share){try{await navigator.share({text:$('shareContent').value});return}catch(e){if(e.name==='AbortError')return}}await copyReport()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='봉사기록-'+today()+'.json';a.click()}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.records)||!Array.isArray(x.visits)||!x.records.every(r=>/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&Number.isInteger(r.min)&&r.min>=0&&['야외 봉사','자원봉사'].includes(r.kind)))throw Error();if(confirm('기존 기록을 백업 내용으로 교체할까요?')){db=x;save();render()}}catch{alert('올바른 백업 파일이 아닙니다.')}}let lastSeenMonth=today().slice(0,7);function checkMonthChange(){let now=today().slice(0,7);if(now!==lastSeenMonth&&page==='홈'){lastSeenMonth=now;month=now;render()}}document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkMonthChange()});setInterval(checkMonthChange,60000);render();</script></html>
